name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Embedded React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Embedded Frontend Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "frontend/dist/index.html was not generated!"
            exit 1
          }

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "baba-tts-release"

      - name: Build Windows Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Setup Inno Setup Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $innoPath = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path "$innoPath\ISCC.exe") {
              echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install innosetup --no-progress -y
              echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Package Installer and Portable Archive
        shell: pwsh
        run: |
          # 1. Resolve normalized version (strip leading 'v')
          $rawVersion = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = "${{ github.ref_name }}"
          }
          $cleanVersion = $rawVersion -replace '^v',''
          Write-Host "Packaging version: $cleanVersion (Raw tag: $rawVersion)"

          # 2. Compile Inno Setup installer
          $targetDir = (Resolve-Path "target/x86_64-pc-windows-msvc/release").Path
          if (-not (Test-Path "$targetDir\WebView2Loader.dll")) {
            Copy-Item "assets/x64/WebView2Loader.dll" -Destination "$targetDir/" -Force
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) { $iscc = $defaultPath } else { $iscc = "iscc.exe" }
          }
          & $iscc "/DMyAppVersion=$cleanVersion" "/DSourceDir=$targetDir" "installer/baba-tts.iss"

          # 3. Create portable zip archive
          $portableDir = "baba-tts-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "$targetDir/baba-tts.exe" -Destination "$portableDir/"
          Copy-Item "$targetDir/WebView2Loader.dll" -Destination "$portableDir/"
          Copy-Item "assets/icon.ico" -Destination "$portableDir/"
          Copy-Item "README.md" -Destination "$portableDir/"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/baba-tts-portable.zip" -Force

          # 4. Generate SHA256 checksums
          Get-FileHash -Algorithm SHA256 -Path "dist/baba-tts-setup.exe", "dist/baba-tts-portable.zip" |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/baba-tts-setup.exe
            dist/baba-tts-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
